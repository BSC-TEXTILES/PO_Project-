# ==============================================================================
# BSC Exclusive POMS — Production Nginx Reverse Proxy Configuration
# Domain: po.bsctextiles.in
# Backend Node.js upstream: 127.0.0.1:4040 (never exposed publicly)
# ==============================================================================

# Rate limiting zones (protect against brute-force and DoS)
limit_req_zone $binary_remote_addr zone=poms_api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=poms_login_limit:10m rate=5r/m;

upstream poms_backend {
    server 127.0.0.1:4040 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. HTTP to HTTPS Redirection (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name po.bsctextiles.in www.po.bsctextiles.in;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Production HTTPS Server (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name po.bsctextiles.in www.po.bsctextiles.in;

    # TLS / SSL Certificate Configuration
    ssl_certificate /etc/letsencrypt/live/po.bsctextiles.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/po.bsctextiles.in/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/po.bsctextiles.in/chain.pem;

    # Modern TLS Security & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Strict Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    # Request size limits (support 50MB LR document and delivery proof uploads)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Timeouts
    client_header_timeout 30s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 65s;

    # Static Assets Caching (Vite immutable assets)
    location ~* ^/(assets|dist)/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /home/u101820758/domains/po.bsctextiles.in/public_html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri @backend;
    }

    # Uploaded Documents (LR and POD attachments)
    location /uploads/ {
        alias /home/u101820758/domains/po.bsctextiles.in/public_html/backend/uploads/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri @backend;
    }

    # Dedicated Login Rate Limit
    location /api/auth/login {
        limit_req zone=poms_login_limit burst=3 nodelay;
        proxy_pass http://poms_backend;
        include /etc/nginx/proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Proxy with Rate Limiting
    location /api/ {
        limit_req zone=poms_api_limit burst=30 nodelay;
        proxy_pass http://poms_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket Proxy for Live Team Chat & Dashboard Sync
    location /ws/ {
        proxy_pass http://poms_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Client-side SPA routing fallback
    location / {
        proxy_pass http://poms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @backend {
        proxy_pass http://poms_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error handling
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
